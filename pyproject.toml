[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "human-like-ai-tester"
version = "0.1.0"
description = "Universal AI testing skill and simulation engine that tests any application type like an authentic human being."
readme = "README.md"
requires-python = ">=3.9"
authors = [
    { name = "Human-Like AI Testing Team" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Testing",
    "Topic :: Software Development :: Quality Assurance",
]

[project.scripts]
human-tester = "human_tester.cli:main"

[tool.setuptools.packages.find]
include = ["human_tester*"]
